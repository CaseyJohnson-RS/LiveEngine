[project]
name = "liveengine"
version = "0.1.0"
description = "Engine of my little game Live"
readme = "README.md"
requires-python = ">=3.15"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--import-mode=importlib"]

[tool.ruff]
line-length = 80
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle: ошибки стиля, включая длину строки (E501)
    "W",    # pycodestyle: предупреждения (пробелы в конце строк и т. п.)
    "F",    # pyflakes: неиспользуемые импорты и переменные, неопределённые имена
    "I",    # isort: порядок импортов
    "B",    # flake8-bugbear: типичные баги (изменяемые аргументы по умолчанию…)
    "UP",   # pyupgrade: современный синтаксис
    "SIM",  # flake8-simplify: упрощение условий и выражений
    "PYI",  # flake8-pyi: у вас в коде уже был noqa на него
]
